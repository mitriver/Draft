<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버미더머니 : 연습생을 이겨라</title>
    <style>
        :root { --accent: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .app-wrapper { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; }
        header h1 { font-size: 2.8rem; color: var(--accent); margin: 0; font-weight: 900; letter-spacing: 2px; }

        /* 리더보드 상단 */
        .points-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .team-status { background: var(--card); padding: 20px 10px; border-radius: 15px; text-align: center; border: 2px solid #334155; transition: 0.3s; }
        .team-status.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); transform: scale(1.05); background: #2d3748; }
        .leader-icon-sm { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid var(--accent); background: #1e293b; }
        .p-name { display: block; font-size: 1.1rem; color: #fff; font-weight: bold; margin-bottom: 5px; }
        .p-value { font-size: 1.4rem; font-weight: 900; color: var(--accent); }

        /* 룰렛 영역 */
        .roulette-container { background: linear-gradient(180deg, #000 0%, #1e293b 100%); padding: 40px; text-align: center; border-radius: 25px; margin-bottom: 30px; border: 3px solid var(--accent); }
        .main-leader-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 5px solid var(--accent); margin-bottom: 20px; background: #0f172a; }
        #roulette-display { font-size: 2.5rem; font-weight: 800; margin-bottom: 25px; color: #fff; }
        .btn-spin { background: var(--accent); color: #000; border: none; padding: 15px 70px; font-weight: 900; cursor: pointer; border-radius: 50px; font-size: 1.3rem; box-shadow: 0 4px 0 #b45309; transition: 0.1s; }
        .btn-spin:active { transform: translateY(3px); box-shadow: none; }
        .btn-spin:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

        /* 플레이어 그리드 */
        .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .draft-item { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: 0.2s; }
        .player-img { width: 100%; height: 210px; object-fit: cover; background: #000; display: block; }
        .item-detail { padding: 12px; text-align: center; }
        .item-name { font-size: 1rem; font-weight: 800; display: block; margin-bottom: 5px; color: #fff; min-height: 1.2rem; }
        .item-cost { color: var(--accent); font-weight: bold; margin-bottom: 10px; display: block; }
        .btn-select { width: 100%; padding: 10px; background: var(--accent); border: none; color: #000; cursor: pointer; font-weight: 800; border-radius: 6px; }
        .btn-select:disabled { background: #475569; opacity: 0.5; cursor: not-allowed; }

        /* 로그창 */
        #log { margin-top: 30px; background: #000; padding: 20px; height: 150px; overflow-y: auto; font-family: 'Consolas', monospace; color: #22c55e; border: 1px solid #334155; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header><h1>버미더머니 : 연습생을 이겨라</h1></header>

    <div class="points-board" id="points-board"></div>

    <div class="roulette-container">
        <img src="https://via.placeholder.com/180?text=READY" class="main-leader-img" id="main-leader-pic">
        <div id="roulette-display">룰렛을 돌려주세요</div>
        <button onclick="spin()" id="spin-btn" class="btn-spin">순서 정하기 (SPIN)</button>
    </div>

    <div class="draft-grid" id="draft-grid"></div>
    <div id="log">>> 시스템 가동... (SOOP 채팅 연동 대기중)</div>
</div>

<script>
    // 1. 리더 설정 (상단 및 룰렛용)
    const teams = [
        { id: 0, name: "밤베", points: 1000, file: "leader1.jpg" },
        { id: 1, name: "찌로", points: 1000, file: "leader2.jpg" },
        { id: 2, name: "윰로로", points: 1000, file: "leader3.jpg" },
        { id: 3, name: "호발", points: 1000, file: "leader4.jpg" },
        { id: 4, name: "프하", points: 1000, file: "leader5.jpg" }
    ];

    let currentTurnTeamIdx = null;

    // 2. 선수 설정 (이름은 모두 비우고 번호와 이미지 매칭만)
    const players = Array.from({ length: 55 }, (_, i) => ({
        id: i,
        name: "", // 모든 선수 이름 비움 ("")
        cost: Math.floor(Math.random() * (600 - 150 + 1)) + 150,
        stock: 1,
        img: `${i + 1}.jpg` // 1.jpg ~ 55.jpg
    }));

    // 화면 업데이트
    function updatePointsBoard() {
        const board = document.getElementById('points-board');
        board.innerHTML = teams.map((t, idx) => `
            <div class="team-status ${currentTurnTeamIdx === idx ? 'active' : ''}">
                <img src="${t.file}" class="leader-icon-sm" onerror="this.src='https://via.placeholder.com/75?text=${t.name[0]}'">
                <span class="p-name">${t.name}</span>
                <span class="p-value">${t.points.toLocaleString()}P</span>
            </div>
        `).join('');
    }

    function render() {
        const grid = document.getElementById('draft-grid');
        grid.innerHTML = players.map((p, idx) => `
            <div class="draft-item">
                <img src="${p.img}" class="player-img" onerror="this.src='https://via.placeholder.com/180x210/1e293b/475569?text=${idx+1}번'">
                <div class="item-detail">
                    <span class="item-name">${p.name}</span>
                    <span class="item-cost">${p.cost} PTS</span>
                    <button class="btn-select" onclick="handleSelection(${idx})" ${p.stock === 0 ? 'disabled' : ''}>
                        ${p.stock === 0 ? '영입 완료' : '영입하기'}
                    </button>
                </div>
            </div>
        `).join('');
    }

    function spin() {
        const display = document.getElementById('roulette-display');
        const mainPic = document.getElementById('main-leader-pic');
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        let count = 0;
        const interval = setInterval(() => {
            const tempIdx = Math.floor(Math.random() * teams.length);
            display.innerText = teams[tempIdx].name;
            mainPic.src = teams[tempIdx].file;
            count++;

            if(count > 20) {
                clearInterval(interval);
                currentTurnTeamIdx = Math.floor(Math.random() * teams.length);
                const winner = teams[currentTurnTeamIdx];
                display.innerHTML = `<span style="color:var(--accent)">🎯 ${winner.name} 턴!</span>`;
                mainPic.src = winner.file;
                btn.disabled = false;
                updatePointsBoard();
                addLog(`[${winner.name}] 리더의 순서입니다. 명령어를 입력하거나 버튼을 누르세요.`);
            }
        }, 60);
    }

    function handleSelection(idx) {
        if(currentTurnTeamIdx === null) return;
        const team = teams[currentTurnTeamIdx];
        const player = players[idx];

        if(player.stock === 0) return;

        if (team.points < player.cost) {
            addLog(`⚠️ [${team.name}] 포인트가 부족하여 영입 불가!`);
            return;
        }

        team.points -= player.cost;
        player.stock = 0;
        addLog(`✅ 영입성공: ${team.name} -> [${idx + 1}번 선수]`);
        
        currentTurnTeamIdx = null; 
        updatePointsBoard();
        render();
        document.getElementById('roulette-display').innerText = '다음 룰렛을 돌려주세요';
        document.getElementById('main-leader-pic').src = "https://via.placeholder.com/180?text=NEXT";
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `>> ${msg}<br>` + log.innerHTML;
        log.scrollTop = log.scrollHeight;
    }

    // --- [채팅 연동 수신부] ---
    window.addEventListener("message", (event) => {
        const data = event.data;
        if (data.type === "CHAT_SELECT") {
            const leaderName = data.leaderName;
            const playerNum = data.playerNum;

            if (currentTurnTeamIdx !== null && teams[currentTurnTeamIdx].name === leaderName) {
                if (playerNum >= 1 && playerNum <= 55) {
                    handleSelection(playerNum - 1);
                }
            } else {
                addLog(`[알림] ${leaderName}: 본인 차례가 아닙니다.`);
            }
        }
    });

    updatePointsBoard();
    render();
</script>
</body>
</html>
