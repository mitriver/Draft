<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버미더머니:연습생을 이겨라</title>
    <style>
        :root { --accent: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .app-wrapper { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; }
        header h1 { font-size: 3rem; color: var(--accent); margin: 0; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }

        /* 리더 현황판 - 크기 키움 */
        .points-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .team-status { background: var(--card); padding: 25px 15px; border-radius: 15px; text-align: center; border: 2px solid #334155; transition: 0.4s; }
        .team-status.active { border-color: var(--accent); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); transform: scale(1.1); background: #2d3748; z-index: 10; }
        
        /* 리더 아이콘 크기 확대 */
        .leader-icon-sm { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 3px solid var(--accent); background: #1e293b; }
        .p-name { display: block; font-size: 1.2rem; color: #fff; font-weight: 800; margin-bottom: 8px; }
        .p-value { font-size: 1.5rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; }

        /* 중앙 룰렛 영역 - 메인 이미지 대폭 확대 */
        .roulette-container { background: linear-gradient(180deg, #000 0%, #1e293b 100%); padding: 50px 20px; text-align: center; border-radius: 25px; margin-bottom: 40px; border: 3px solid var(--accent); position: relative; overflow: hidden; }
        .main-leader-img { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 6px solid var(--accent); margin-bottom: 25px; background: #0f172a; box-shadow: 0 0 30px rgba(0,0,0,0.8); transition: 0.2s; }
        #roulette-display { font-size: 2.8rem; font-weight: 900; margin-bottom: 30px; color: #fff; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
        
        .btn-spin { background: var(--accent); color: #000; border: none; padding: 20px 80px; font-weight: 900; cursor: pointer; border-radius: 60px; font-size: 1.4rem; transition: 0.2s; box-shadow: 0 6px 0 #b45309; }
        .btn-spin:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-spin:active { transform: translateY(4px); box-shadow: none; }
        .btn-spin:disabled { background: #475569; cursor: not-allowed; box-shadow: none; transform: none; }

        /* 플레이어 그리드 */
        .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .draft-item { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #334155; opacity: 0.9; }
        .player-img { width: 100%; height: 230px; object-fit: cover; background: #000; display: block; }
        .item-detail { padding: 15px; text-align: center; }
        .item-name { font-size: 1.1rem; font-weight: 800; display: block; margin-bottom: 5px; color: #fff; min-height: 1.2rem; }
        .item-cost { color: var(--accent); font-weight: bold; margin-bottom: 12px; display: block; font-size: 1.1rem; }
        .btn-select { width: 100%; padding: 12px; background: var(--accent); border: none; color: #000; cursor: pointer; font-weight: 800; border-radius: 8px; font-size: 1rem; }
        .btn-select:disabled { background: #475569; opacity: 0.4; }

        #log { margin-top: 40px; background: #000; padding: 20px; height: 180px; overflow-y: auto; font-family: 'Consolas', monospace; color: #22c55e; border: 1px solid #334155; border-radius: 12px; font-size: 1rem; line-height: 1.6; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header><h1>버미더머니 : 연습생을 이겨라</h1></header>

    <div class="points-board" id="points-board"></div>

    <div class="roulette-container">
        <img src="https://via.placeholder.com/220?text=READY" class="main-leader-img" id="main-leader-pic">
        <div id="roulette-display">룰렛을 돌려주세요</div>
        <button onclick="spin()" id="spin-btn" class="btn-spin">순서 정하기 (SPIN)</button>
    </div>

    <div class="draft-grid" id="draft-grid"></div>
    <div id="log">>> 버미더머니 시스템 가동... 리더 크기 강화 완료.</div>
</div>

<script>
    const teams = [
        { id: 0, name: "밤베", points: 1000, file: "leader1.jpg" },
        { id: 1, name: "찌로", points: 1000, file: "leader2.jpg" },
        { id: 2, name: "윰로로", points: 1000, file: "leader3.jpg" },
        { id: 3, name: "호발", points: 1000, file: "leader4.jpg" },
        { id: 4, name: "프하", points: 1000, file: "leader5.jpg" }
    ];

    let currentTurnTeamIdx = null;

    const players = Array.from({ length: 55 }, (_, i) => ({
        id: i,
        name: "", 
        cost: Math.floor(Math.random() * (600 - 150 + 1)) + 150,
        stock: 1,
        img: `${i + 1}.jpg` 
    }));

    function updatePointsBoard() {
        const board = document.getElementById('points-board');
        board.innerHTML = teams.map((t, idx) => `
            <div class="team-status ${currentTurnTeamIdx === idx ? 'active' : ''}">
                <img src="${t.file}" class="leader-icon-sm" onerror="this.src='https://via.placeholder.com/80?text=${t.name[0]}'">
                <span class="p-name">${t.name}</span>
                <span class="p-value">${t.points.toLocaleString()}P</span>
            </div>
        `).join('');
    }

    function handleImgError(img) {
        img.onerror = null;
        img.src = "https://via.placeholder.com/200x230/1e293b/475569?text=READY";
        return true;
    }

    function spin() {
        const display = document.getElementById('roulette-display');
        const mainPic = document.getElementById('main-leader-pic');
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        let count = 0;
        const interval = setInterval(() => {
            const tempIdx = Math.floor(Math.random() * teams.length);
            display.innerText = teams[tempIdx].name;
            mainPic.src = teams[tempIdx].file;
            count++;

            if(count > 25) { // 룰렛 시간 약간 증가
                clearInterval(interval);
                currentTurnTeamIdx = Math.floor(Math.random() * teams.length);
                const winner = teams[currentTurnTeamIdx];
                display.innerHTML = `<span style="color:var(--accent)">🎯 ${winner.name} 님의 차례!</span>`;
                mainPic.src = winner.file;
                mainPic.onerror = () => mainPic.src = "https://via.placeholder.com/220?text=" + winner.name;
                btn.disabled = false;
                updatePointsBoard();
                render();
                addLog(`[${winner.name}] 리더 선택 중...`);
            }
        }, 60);
    }

    function render() {
        const grid = document.getElementById('draft-grid');
        grid.innerHTML = players.map((p, idx) => `
            <div class="draft-item">
                <img src="${p.img}" class="player-img" onerror="handleImgError(this)">
                <div class="item-detail">
                    <span class="item-name">${p.name}</span>
                    <span class="item-cost">${p.cost} PTS</span>
                    <button class="btn-select" onclick="handleSelection(${idx})" ${p.stock === 0 ? 'disabled' : ''}>
                        ${p.stock === 0 ? '영입 완료' : '영입하기'}
                    </button>
                </div>
            </div>
        `).join('');
    }

    function handleSelection(idx) {
        if(currentTurnTeamIdx === null) return alert("룰렛을 먼저 돌려주세요!");
        const team = teams[currentTurnTeamIdx];
        const player = players[idx];

        if (team.points < player.cost) {
            addLog(`⚠️ [${team.name}] 예산 부족!`);
            autoRandomPick(team);
        } else {
            processSelection(team, player);
        }
    }

    function autoRandomPick(team) {
        const affordable = players.filter(p => p.stock > 0 && p.cost <= team.points);
        if (affordable.length === 0) {
            addLog(`❌ [${team.name}] 영입 가능 대상 없음.`);
        } else {
            const randomPlayer = affordable[Math.floor(Math.random() * affordable.length)];
            addLog(`🎲 랜덤 영입: [${team.name}] -> [No.${randomPlayer.id + 1}]`);
            processSelection(team, randomPlayer);
        }
    }

    function processSelection(team, player) {
        team.points -= player.cost;
        player.stock = 0;
        addLog(`✅ 영입 성공: ${team.name} -> [No.${player.id + 1}]`);
        currentTurnTeamIdx = null; 
        updatePointsBoard();
        render();
        document.getElementById('roulette-display').innerText = '다음 순서를 정해주세요';
        document.getElementById('main-leader-pic').src = "https://via.placeholder.com/220?text=NEXT";
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `>> ${msg}<br>` + log.innerHTML;
        log.scrollTop = log.scrollHeight;
    }

    updatePointsBoard();
    render();
</script>
</body>
</html>
