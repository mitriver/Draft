<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAFT | JPG Edition</title>
    <style>
        :root { --accent: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .app-wrapper { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; }
        header h1 { font-size: 3rem; color: var(--accent); margin: 0; font-weight: 900; letter-spacing: 5px; }

        .points-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .team-status { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .team-status.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .p-name { display: block; font-size: 0.8rem; color: #94a3b8; }
        .p-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        .roulette-container { background: #000; padding: 25px; text-align: center; border-radius: 15px; margin-bottom: 30px; border: 2px solid var(--accent); }
        #roulette-display { font-size: 1.8rem; font-weight: 800; margin: 15px 0; }
        .btn-spin { background: var(--accent); color: #000; border: none; padding: 12px 40px; font-weight: 900; cursor: pointer; border-radius: 50px; font-size: 1rem; }

        .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .draft-item { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        .player-img { width: 100%; height: 280px; object-fit: cover; background: #000; display: block; }
        .item-detail { padding: 15px; text-align: center; }
        .item-name { font-size: 1.2rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .item-cost { color: var(--accent); font-weight: bold; margin-bottom: 15px; display: block; }
        
        .btn-select { width: 100%; padding: 10px; background: var(--accent); border: none; color: #000; cursor: pointer; font-weight: 800; border-radius: 6px; }
        .btn-select:disabled { background: #475569; color: #1e293b; cursor: not-allowed; }

        #log { margin-top: 30px; background: #000; padding: 15px; height: 100px; overflow-y: auto; font-family: monospace; color: #22c55e; border: 1px solid #1e293b; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header><h1>DRAFT</h1></header>

    <div class="points-board" id="points-board"></div>

    <div class="roulette-container">
        <div id="roulette-display">READY TO START</div>
        <button onclick="spin()" id="spin-btn" class="btn-spin">RUN ROULETTE</button>
    </div>

    <div class="draft-grid" id="draft-grid"></div>
    <div id="log">>> SYSTEM ONLINE. ALL PLAYERS ASSIGNED 1,000 PTS.</div>
</div>

<script>
    // 1. 팀 데이터
    const teams = [
        { id: 0, name: "CHELSEA", points: 1000, img: "leader1.jpg" },
        { id: 1, name: "MAN CITY", points: 1000, img: "leader2.jpg" },
        { id: 2, name: "TOTTENHAM", points: 1000, img: "leader3.jpg" },
        { id: 3, name: "ARSENAL", points: 1000, img: "leader4.jpg" }
    ];

    let currentTurnTeamIdx = null;

    // 2. 선수 데이터 (전부 .jpg로 수정)
    const players = [
        { name: "SON HEUNG-MIN", cost: 700, stock: 1, img: "son.jpg" },
        { name: "LIONEL MESSI", cost: 650, stock: 1, img: "messi.jpg" },
        { name: "ERLING HAALAND", cost: 600, stock: 1, img: "haaland.jpg" },
        { name: "CHELSEA STAR", cost: 500, stock: 1, img: "player1.jpg" }
    ];

    function updatePointsBoard() {
        const board = document.getElementById('points-board');
        board.innerHTML = teams.map((t, idx) => `
            <div class="team-status ${currentTurnTeamIdx === idx ? 'active' : ''}">
                <span class="p-name">${t.name}</span>
                <span class="p-value">${t.points.toLocaleString()}P</span>
            </div>
        `).join('');
    }

    // 이미지 로딩 에러 방지용 함수
    function handleImgError(img) {
        img.onerror = null; // 무한 루프 방지
        img.src = "https://via.placeholder.com/250x280/1e293b/475569?text=PHOTO+NOT+FOUND";
        return true;
    }

    function spin() {
        const display = document.getElementById('roulette-display');
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        let count = 0;
        const interval = setInterval(() => {
            display.innerText = teams[Math.floor(Math.random() * teams.length)].name;
            count++;

            if(count > 15) {
                clearInterval(interval);
                currentTurnTeamIdx = Math.floor(Math.random() * teams.length);
                const winner = teams[currentTurnTeamIdx];
                display.innerHTML = `<span style="color:var(--accent)">🎯 ${winner.name}'s TURN</span>`;
                btn.disabled = false;
                updatePointsBoard();
                render();
                addLog(`[${winner.name}] IS SELECTING.`);
            }
        }, 70);
    }

    function render() {
        const grid = document.getElementById('draft-grid');
        const turnTeam = teams[currentTurnTeamIdx];

        grid.innerHTML = players.map((p, idx) => {
            const canPick = turnTeam && p.stock > 0 && turnTeam.points >= p.cost;
            
            return `
                <div class="draft-item">
                    <img src="${p.img}" class="player-img" onerror="handleImgError(this)">
                    <div class="item-detail">
                        <span class="item-name">${p.name}</span>
                        <span class="item-cost">${p.cost} PTS</span>
                        <button class="btn-select" onclick="select(${idx})" ${!canPick ? 'disabled' : ''}>
                            ${p.stock === 0 ? 'SOLD OUT' : 'PICK PLAYER'}
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function select(idx) {
        if(currentTurnTeamIdx === null) return;
        const team = teams[currentTurnTeamIdx];
        const player = players[idx];

        team.points -= player.cost;
        player.stock--;
        
        addLog(`${team.name} SIGNED [${player.name}].`);
        currentTurnTeamIdx = null;
        updatePointsBoard();
        render();
        document.getElementById('roulette-display').innerText = 'NEXT TURN';
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `>> ${msg}<br>` + log.innerHTML;
    }

    updatePointsBoard();
    render();
</script>

</body>
</html>
