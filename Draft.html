<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAFT | Premium Selection System</title>
    <style>
        :root {
            --accent: #f59e0b; /* 골드 */
            --primary: #1e293b;
            --secondary: #334155;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        
        body { 
            font-family: 'Inter', 'Pretendard', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            line-height: 1.6;
        }

        .app-wrapper { max-width: 1000px; margin: 0 auto; }

        /* 헤더 디자인 */
        header { 
            text-align: center; 
            padding: 40px 0;
            border-bottom: 1px solid var(--secondary);
            margin-bottom: 40px;
        }
        header h1 { 
            font-size: 4rem; 
            letter-spacing: 0.2em; 
            margin: 0; 
            color: var(--accent);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        header p { color: #94a3b8; font-size: 1rem; margin-top: 5px; }

        /* 대시보드 */
        .dashboard { 
            display: flex; gap: 20px; margin-bottom: 30px;
        }
        .stat-box { 
            flex: 1; background: var(--primary); padding: 25px; 
            border-radius: 4px; border-left: 4px solid var(--accent);
        }
        .stat-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 5px; }

        /* 룰렛 섹션 */
        .roulette-container {
            background: var(--secondary);
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 40px;
        }
        #roulette-display { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin-bottom: 25px;
            color: #fff;
        }
        .btn-spin {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn-spin:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-spin:disabled { background: #475569; cursor: not-allowed; }

        /* 드래프트 리스트 */
        .draft-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; 
        }
        .draft-item {
            background: var(--primary);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #334155;
            transition: 0.3s;
        }
        .draft-item:hover { border-color: var(--accent); }
        .item-info { margin-bottom: 20px; }
        .item-name { font-size: 1.2rem; font-weight: 600; display: block; margin-bottom: 5px; }
        .item-cost { color: var(--accent); font-weight: bold; }
        
        .btn-select {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        .btn-select:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
        .btn-select:disabled { border-color: #475569; color: #475569; }

        /* 로그 */
        #log {
            margin-top: 40px;
            background: #000;
            padding: 20px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #10b981;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header>
        <h1>DRAFT</h1>
        <p>CHOOSE YOUR DESTINY WITH 1,000 POINTS</p>
    </header>

    <div class="dashboard">
        <div class="stat-box">
            <div class="stat-label">Current Turn</div>
            <div id="current-user" class="stat-value">WAITING...</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Remaining Points</div>
            <div id="points" class="stat-value">1,000</div>
        </div>
    </div>

    <div class="roulette-container">
        <div id="roulette-display">READY TO SPIN</div>
        <button onclick="spin()" id="spin-btn" class="btn-spin">Run Roulette</button>
    </div>

    <div class="draft-grid" id="draft-grid"></div>

    <div id="log">>> SYSTEM READY. AWAITING INPUT...</div>
</div>

<script>
    const users = ["PLAYER 1", "PLAYER 2", "PLAYER 3", "PLAYER 4"];
    let points = 1000;
    
    const items = [
        { name: "ULTIMATE UNIT", cost: 600, stock: 1 },
        { name: "ELITE WEAPON", cost: 350, stock: 2 },
        { name: "RECOVERY KIT", cost: 150, stock: 4 },
        { name: "TACTICAL GEAR", cost: 250, stock: 2 },
        { name: "RANDOM BOX", cost: 200, stock: 3 }
    ];

    function spin() {
        const display = document.getElementById('roulette-display');
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        let count = 0;
        const interval = setInterval(() => {
            display.innerText = users[Math.floor(Math.random() * users.length)];
            display.style.color = (count % 2 === 0) ? '#f59e0b' : '#fff';
            count++;

            if(count > 20) {
                clearInterval(interval);
                const winner = users[Math.floor(Math.random() * users.length)];
                display.innerText = winner;
                display.style.color = '#fff';
                document.getElementById('current-user').innerText = winner;
                btn.disabled = false;
                addLog(`TARGET LOCKED: ${winner} IS NOW SELECTING.`);
            }
        }, 70);
    }

    function render() {
        const grid = document.getElementById('draft-grid');
        grid.innerHTML = items.map((item, idx) => `
            <div class="draft-item">
                <div class="item-info">
                    <span class="item-name">${item.name}</span>
                    <span class="item-cost">${item.cost} PTS</span>
                </div>
                <div style="font-size: 0.8rem; margin-bottom: 10px; color: #94a3b8;">STOCK: ${item.stock}</div>
                <button class="btn-select" 
                    onclick="select(${idx})" 
                    ${item.stock === 0 || points < item.cost ? 'disabled' : ''}>
                    ${item.stock === 0 ? 'OUT OF STOCK' : 'SELECT'}
                </button>
            </div>
        `).join('');
    }

    function select(idx) {
        const user = document.getElementById('current-user').innerText;
        if(user === 'WAITING...') return alert("Please run the roulette first.");

        const item = items[idx];
        points -= item.cost;
        item.stock--;
        
        document.getElementById('points').innerText = points.toLocaleString();
        addLog(`${user} SELECTED [${item.name}]. ${points} PTS REMAINING.`);
        document.getElementById('current-user').innerText = 'WAITING...';
        render();
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `>> ${msg}<br>` + log.innerHTML;
    }

    render();
</script>

</body>
</html>
