<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAFT | Manager Edition</title>
    <style>
        :root { --accent: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .app-wrapper { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; }
        header h1 { font-size: 3rem; color: var(--accent); margin: 0; font-weight: 900; letter-spacing: 5px; }

        /* 팀별 포인트 현황판 */
        .points-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .team-status { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #334155; transition: 0.3s; }
        .team-status.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); transform: scale(1.05); }
        .leader-icon-sm { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; border: 2px solid var(--accent); background: #1e293b; }
        .p-name { display: block; font-size: 0.9rem; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
        .p-value { font-size: 1.3rem; font-weight: bold; color: var(--accent); }

        /* 룰렛 영역 */
        .roulette-container { background: #000; padding: 30px; text-align: center; border-radius: 15px; margin-bottom: 30px; border: 2px solid var(--accent); }
        .main-leader-img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); margin-bottom: 15px; background: #1e293b; }
        #roulette-display { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .btn-spin { background: var(--accent); color: #000; border: none; padding: 15px 60px; font-weight: 900; cursor: pointer; border-radius: 50px; font-size: 1.2rem; transition: 0.2s; }
        .btn-spin:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        .btn-spin:disabled { background: #475569; cursor: not-allowed; }

        /* 선수 그리드 */
        .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .draft-item { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: 0.3s; }
        .draft-item:hover { border-color: var(--accent); }
        .player-img { width: 100%; height: 220px; object-fit: cover; background: #000; display: block; }
        .item-detail { padding: 15px; text-align: center; }
        .item-name { font-size: 1.1rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .item-cost { color: var(--accent); font-weight: bold; margin-bottom: 12px; display: block; }
        
        .btn-select { width: 100%; padding: 12px; background: var(--accent); border: none; color: #000; cursor: pointer; font-weight: 800; border-radius: 6px; }
        .btn-select:disabled { background: #475569; color: #1e293b; cursor: not-allowed; opacity: 0.6; }

        #log { margin-top: 30px; background: #000; padding: 15px; height: 160px; overflow-y: auto; font-family: 'Consolas', monospace; color: #22c55e; border: 1px solid #1e293b; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header><h1>DRAFT SYSTEM</h1></header>

    <div class="points-board" id="points-board"></div>

    <div class="roulette-container">
        <img src="https://via.placeholder.com/140?text=READY" class="main-leader-img" id="main-leader-pic">
        <div id="roulette-display">룰렛을 돌려주세요</div>
        <button onclick="spin()" id="spin-btn" class="btn-spin">순서 정하기 (SPIN)</button>
    </div>

    <div class="draft-grid" id="draft-grid"></div>
    <div id="log">>> 시스템 가동... 5명의 감독에게 각각 1,000P가 지급되었습니다.</div>
</div>

<script>
    // 1. 리더(감독) 데이터 - 이름만 한글로 변경, 파일명 유지
    const teams = [
        { id: 0, name: "펩 과르디올라", points: 1000, file: "leader1.jpg" },
        { id: 1, name: "아르테타", points: 1000, file: "leader2.jpg" },
        { id: 2, name: "에메리", points: 1000, file: "leader3.jpg" },
        { id: 3, name: "마이클 캐릭", points: 1000, file: "leader4.jpg" },
        { id: 4, name: "로세니어", points: 1000, file: "leader5.jpg" }
    ];

    let currentTurnTeamIdx = null;

    // 2. 선수 55명 명단 (파일명: 이름.jpg)
    const playerNames = ["손흥민", "메시", "홀란드", "음바페", "살라", "케인", "더브라위너", "벨링엄", "비니시우스", "레반도프스키", "네이마르", "모드리치", "사카", "포든", "로드리", "반다이크", "디아스", "알리송", "쿠르투아", "그리즈만", "뮐러", "킴미히", "무시알라", "엔조", "누녜스", "래시포드", "카제미루", "외데고르", "라이스", "브루노", "이강인", "김민재", "황희찬", "조규성", "이재성", "백승호", "정우영", "설영우", "김승규", "나상호", "엄원상", "오현규", "권창훈", "박지수", "김영권", "김진수", "이용", "홍철", "조현우", "황의조", "이동경", "이동준", "송민규", "강상우", "박지성"];
    
    const players = playerNames.map((name, index) => ({
        id: index,
        name: name,
        cost: Math.floor(Math.random() * (600 - 150 + 1)) + 150, // 최소 150P 이상으로 조정
        stock: 1,
        img: `${name}.jpg`
    }));

    function updatePointsBoard() {
        const board = document.getElementById('points-board');
        board.innerHTML = teams.map((t, idx) => `
            <div class="team-status ${currentTurnTeamIdx === idx ? 'active' : ''}">
                <img src="${t.file}" class="leader-icon-sm" onerror="this.src='https://via.placeholder.com/50?text=Manager'">
                <span class="p-name">${t.name}</span>
                <span class="p-value">${t.points.toLocaleString()}P</span>
            </div>
        `).join('');
    }

    function handleImgError(img) {
        img.onerror = null;
        img.src = "https://via.placeholder.com/200x220/1e293b/475569?text=사진없음";
        return true;
    }

    function spin() {
        const display = document.getElementById('roulette-display');
        const mainPic = document.getElementById('main-leader-pic');
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        let count = 0;
        const interval = setInterval(() => {
            const tempIdx = Math.floor(Math.random() * teams.length);
            display.innerText = teams[tempIdx].name;
            mainPic.src = teams[tempIdx].file;
            count++;

            if(count > 20) {
                clearInterval(interval);
                currentTurnTeamIdx = Math.floor(Math.random() * teams.length);
                const winner = teams[currentTurnTeamIdx];
                display.innerHTML = `<span style="color:var(--accent)">🎯 ${winner.name} 감독님 선택!</span>`;
                mainPic.src = winner.file;
                mainPic.onerror = () => mainPic.src = "https://via.placeholder.com/140?text=LEADER";
                
                btn.disabled = false;
                updatePointsBoard();
                render();
                addLog(`[${winner.name}] 감독님의 차례입니다. 선수를 영입하세요.`);
            }
        }, 60);
    }

    function render() {
        const grid = document.getElementById('draft-grid');
        grid.innerHTML = players.map((p, idx) => `
            <div class="draft-item">
                <img src="${p.img}" class="player-img" onerror="handleImgError(this)">
                <div class="item-detail">
                    <span class="item-name">${p.name}</span>
                    <span class="item-cost">${p.cost} PTS</span>
                    <button class="btn-select" onclick="handleSelection(${idx})" ${p.stock === 0 ? 'disabled' : ''}>
                        ${p.stock === 0 ? '영입 완료' : '영입하기'}
                    </button>
                </div>
            </div>
        `).join('');
    }

    function handleSelection(idx) {
        if(currentTurnTeamIdx === null) return alert("룰렛을 먼저 돌려주세요!");
        const team = teams[currentTurnTeamIdx];
        const player = players[idx];

        if (team.points < player.cost) {
            addLog(`⚠️ [${team.name}] 예산 부족! (잔액: ${team.points}P / 필요: ${player.cost}P)`);
            autoRandomPick(team);
        } else {
            processSelection(team, player);
        }
    }

    function autoRandomPick(team) {
        const affordable = players.filter(p => p.stock > 0 && p.cost <= team.points);
        if (affordable.length === 0) {
            addLog(`❌ [${team.name}] 감독님, 남은 포인트로 영입 가능한 선수가 없습니다.`);
        } else {
            const randomPlayer = affordable[Math.floor(Math.random() * affordable.length)];
            addLog(`🎲 랜덤 시스템: [${team.name}] 감독님이 [${randomPlayer.name}]을 자동 영입했습니다.`);
            processSelection(team, randomPlayer);
        }
    }

    function processSelection(team, player) {
        team.points -= player.cost;
        player.stock = 0;
        addLog(`✅ 영입 성공: ${team.name} -> [${player.name}] (${player.cost}P 지출)`);
        currentTurnTeamIdx = null; 
        updatePointsBoard();
        render();
        document.getElementById('roulette-display').innerText = '다음 감독님을 정해주세요';
        document.getElementById('main-leader-pic').src = "https://via.placeholder.com/140?text=NEXT";
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `>> ${msg}<br>` + log.innerHTML;
        log.scrollTop = log.scrollHeight;
    }

    updatePointsBoard();
    render();
</script>
</body>
</html>
